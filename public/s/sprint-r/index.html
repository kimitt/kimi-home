<!-- 짧은 주소: /s/sprint-r (스레드 댓글용) → 글 주소로 이동.
     들어온 쿼리스트링(utm_campaign, utm_content 등)을 그대로 넘기고,
     쿼리가 없을 때만 기본 UTM을 붙인다.
     meta refresh 보다 먼저 실행돼야 하므로 script 를 위에 둔다. -->
<script>
  const path = "#/notes/2026-10-07-brand-sprint-prompt";
  const qs = location.search || "?utm_source=threads&utm_medium=social&utm_campaign=sprint&utm_content=reply";
  location.replace("../../" + qs + path);
</script>
<!-- 아래 둘은 JS 가 꺼진 경우용 폴백이라 기본값 고정 -->
<meta http-equiv="refresh" content="0; url=../../?utm_source=threads&utm_medium=social&utm_campaign=sprint&utm_content=reply#/notes/2026-10-07-brand-sprint-prompt">
</head>
<body>

</body>
